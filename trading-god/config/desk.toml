# Trading God desk settings.
#
# Setup copies this file to %USERPROFILE%\.trading-god\desk.toml once. Edit that
# copy, not this one, then restart the desk (close its window and run start.ps1).

[moomoo]
host = "127.0.0.1"        # where moomoo OpenD runs
port = 11111              # OpenD's API port (the default)
security_firm = "FUTUINC" # moomoo US. Other regions: FUTUSG, FUTUAU, FUTUCA, FUTUJP, FUTUMY
market = "US"
acc_id = 0                # 0 = use the first US paper stock account OpenD reports

[risk]
# Hard limits. Every proposal is checked when the agent makes it, and again
# against the live account when you approve it. Percentages are of equity.
max_order_pct = 5.0         # one buy order: at most 5% of equity ($50,000 on $1M)
max_position_pct = 10.0     # one stock after a buy: at most 10% of equity
max_invested_pct = 90.0     # all stocks after a buy: at most 90% (keeps 10% cash)
max_buys_per_day = 5        # buy orders placed per US trading day (sells are never capped)
max_pending = 10            # proposals waiting for you at the same time
min_price = 5.0             # no buying stocks under $5
max_limit_deviation_pct = 15.0  # a limit price more than 15% from the last price is refused
allow_market_orders = true
market_order_buffer_pct = 1.0   # market buys are sized at last price + 1%
blocked_symbols = []        # e.g. ["GME", "AMC"]
earnings_blackout_days = 5  # no new buy when earnings are this many trading days away or fewer; 0 = off

[proposals]
ttl_hours = 12              # an undecided proposal expires after this many hours, but never
                            # before the next US market close, so evening scans last into the session

[exits]
# A stop that waits for you is no stop. While the desk runs, it checks every
# position bought through it against that buy's stop, and in market hours sells
# it at market, without asking, once the price is at or below the stop. A gap
# down can fill below the stop. Set auto_stop = false to approve those sells too.
auto_stop = true
check_seconds = 60          # how often prices are checked
retry_minutes = 30          # wait this long before retrying a failed automatic sell
# Trailing stop: once a day the stop moves up to the highest close since the buy
# minus this many average daily ranges (ATR), so a calm stock trails close and a
# jumpy one gets room. It never moves down. 0 turns trailing off.
trail_atr_multiple = 3.0
trail_atr_days = 14
# Only buys with one of these playbooks trail. Buffett, Lynch and Marks sell on the
# thesis, not on price, so their buys keep the stop they were approved with.
trail_playbooks = ["minervini-vcp", "oneil-canslim"]

[swing]
# A swing buy (one the agent gives max_hold_days) carries its whole exit plan: a
# stop, a target and a last day. Approving the buy approves all three, and while
# the desk runs it sells at market, without asking, at whichever comes first.
min_hold_days = 2
max_hold_days = 10
min_reward_risk = 1.5       # the target must be this many times the distance to the stop
auto_target = true          # false: the agent proposes the target sell for you to approve
auto_time_exit = true       # false: same for the last day; otherwise it sells from 15:45 New York

[web]
host = "127.0.0.1"          # the desk page is for this computer only
port = 8765

[telegram]
# Optional: get a phone message when a proposal is waiting or a stop was sold. Create a bot with
# @BotFather, send it a message, then put its token and your chat id here.
bot_token = ""
chat_id = ""

[schedule]
vibe_url = "http://127.0.0.1:8899"
cron = "35 8 * * 1-5"       # 8:35 a.m. New York time, Monday to Friday
timezone = "America/New_York"
max_proposals_per_run = 3
