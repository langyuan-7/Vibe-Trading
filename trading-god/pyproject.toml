[project]
name = "trading-god"
version = "0.1.0"
description = "Human-approved paper trading desk that connects the Vibe-Trading agent to a moomoo paper account"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
# Everything else (fastapi, uvicorn, mcp, pandas, yfinance, tzdata) already
# ships with vibe-trading-ai, which is installed into the same environment.
dependencies = [
    "vibe-trading-ai",
    "futu-api>=9.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
tg-desk = "trading_god.cli:main"
tg-desk-mcp = "trading_god.mcp_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trading_god*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
